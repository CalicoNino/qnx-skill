<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#0b1020"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="44" font-size="20" font-weight="700" fill="#f8fafc">How QNX OS 8.0 is put together</text>
    <text x="32" y="68" font-size="14" fill="#94a3b8">Everything except the microkernel is an ordinary, MMU-isolated, restartable process.</text>

    <!-- user space band -->
    <rect x="24" y="88" width="912" height="214" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="40" y="112" font-size="12" font-weight="700" fill="#64748b" letter-spacing="2">USER SPACE</text>

    <!-- QPLMS supervisor -->
    <rect x="40" y="124" width="200" height="60" rx="10" fill="#2a1f0f" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="140" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#fcd34d">QPLMS</text>
    <text x="140" y="170" text-anchor="middle" font-size="12" fill="#fde68a">launch · monitor · restart</text>

    <!-- apps -->
    <rect x="280" y="124" width="190" height="60" rx="10" fill="#111a33" stroke="#334155" stroke-width="1.5"/>
    <text x="375" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">control app</text>
    <text x="375" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">client · prio 50 (FIFO)</text>

    <rect x="490" y="124" width="190" height="60" rx="10" fill="#111a33" stroke="#334155" stroke-width="1.5"/>
    <text x="585" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">ML / logger</text>
    <text x="585" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">client · sporadic budget</text>

    <rect x="700" y="124" width="220" height="60" rx="10" fill="#111a33" stroke="#334155" stroke-width="1.5"/>
    <text x="810" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">secpol · pathtrust</text>
    <text x="810" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">abilities per process type</text>

    <!-- resource managers -->
    <g font-size="14" font-weight="700">
      <rect x="40" y="224" width="160" height="56" rx="10" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="120" y="248" text-anchor="middle" fill="#e0f2fe">/dev/imu</text>
      <text x="120" y="266" text-anchor="middle" font-size="11" font-weight="400" fill="#7dd3fc">your resource manager</text>

      <rect x="216" y="224" width="160" height="56" rx="10" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="296" y="248" text-anchor="middle" fill="#e0f2fe">io-sock</text>
      <text x="296" y="266" text-anchor="middle" font-size="11" font-weight="400" fill="#7dd3fc">network stack</text>

      <rect x="392" y="224" width="160" height="56" rx="10" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="472" y="248" text-anchor="middle" fill="#e0f2fe">devb-sdmmc</text>
      <text x="472" y="266" text-anchor="middle" font-size="11" font-weight="400" fill="#7dd3fc">filesystem / block</text>

      <rect x="568" y="224" width="160" height="56" rx="10" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="648" y="248" text-anchor="middle" fill="#e0f2fe">i2c · spi · gpio</text>
      <text x="648" y="266" text-anchor="middle" font-size="11" font-weight="400" fill="#7dd3fc">bus drivers</text>

      <rect x="744" y="224" width="176" height="56" rx="10" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="832" y="248" text-anchor="middle" fill="#e0f2fe">slogger2</text>
      <text x="832" y="266" text-anchor="middle" font-size="11" font-weight="400" fill="#7dd3fc">system log</text>
    </g>

    <!-- message arrows -->
    <g stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M330 184 L170 222"/>
      <path d="M620 184 L790 222"/>
    </g>
    <text x="262" y="198" font-size="12" fill="#7dd3fc">MsgSend()</text>
    <text x="712" y="198" font-size="12" fill="#7dd3fc">MsgSend()</text>
    <!-- supervision arrow -->
    <path d="M100 184 L100 222" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#b)"/>
    <text x="108" y="208" font-size="12" fill="#fcd34d">restart</text>

    <!-- kernel band -->
    <rect x="24" y="320" width="912" height="126" rx="14" fill="#0c1a2b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="40" y="344" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">KERNEL · procnto-smp-instr</text>
    <g font-size="13" fill="#e2e8f0">
      <rect x="40" y="358" width="140" height="34" rx="8" fill="#0b1020" stroke="#1e3a5f"/><text x="110" y="380" text-anchor="middle">threads &amp; scheduling</text>
      <rect x="192" y="358" width="140" height="34" rx="8" fill="#0b1020" stroke="#1e3a5f"/><text x="262" y="380" text-anchor="middle">message passing</text>
      <rect x="344" y="358" width="140" height="34" rx="8" fill="#0b1020" stroke="#1e3a5f"/><text x="414" y="380" text-anchor="middle">priority inheritance</text>
      <rect x="496" y="358" width="120" height="34" rx="8" fill="#0b1020" stroke="#1e3a5f"/><text x="556" y="380" text-anchor="middle">timers · signals</text>
      <rect x="628" y="358" width="140" height="34" rx="8" fill="#0b1020" stroke="#1e3a5f"/><text x="698" y="380" text-anchor="middle">interrupts → ISTs</text>
      <rect x="780" y="358" width="140" height="34" rx="8" fill="#0b1020" stroke="#1e3a5f"/><text x="850" y="380" text-anchor="middle">pathname space</text>
    </g>
    <text x="40" y="426" font-size="13" fill="#94a3b8">Drivers crash as processes, not kernels. Servers inherit their client's priority. Every claim provable with tracelogger.</text>
  </g>
</svg>
